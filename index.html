  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #060818; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

    /* ---- Ses kontrolü + imza ---- */
    #soundControl {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #soundBtn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.15s ease, color 0.15s ease;
      padding: 0;
    }
    #soundBtn:hover { background: rgba(255,255,255,0.12); }
    #soundBtn:active { background: rgba(255,255,255,0.18); }
    #soundBtn[aria-pressed="false"] { color: rgba(255,255,255,0.35); }

    #signature {
      font: 11px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.3px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>

<body>
  <canvas id="sky"></canvas>

  <!-- Ses kontrolü + imza -->
  <div id="soundControl">
    <button id="soundBtn" type="button" aria-label="Sesi aç/kapat" aria-pressed="true">
      <svg id="soundOnIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
      </svg>
      <svg id="soundOffIcon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none;">
        <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
      </svg>
    </button>
    <div id="signature">A. Emre Canaslan</div>
  </div>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("sky");
      var ctx = canvas.getContext("2d");
      var W = 0, H = 0, dpr = 1;

      var SKY_TOP = "#05060f";
      var SKY_BOTTOM = "#1a1430";

      var SEA_RATIO = 0.15;
      var SEA_TOP_COLOR = "#16203a";
      var SEA_BOTTOM_COLOR = "#0a1024";

      var TWO_PI = Math.PI * 2;

      var stars = [];
      var jellies = [];
      var animFrame = 0;
      var SEA_TOP = 0;
      var SEA_BOTTOM = 0;

      var pageVisible = true;
      var rafId = null;

      var audioUnlocked = false;
      var soundEnabled = true;

      var wakeLock = null;
      var wakeLockRequested = false;
      var randomExplosionTimer = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        SEA_BOTTOM = H;
        SEA_TOP = Math.round(H * (1 - SEA_RATIO));
        initStars();
        initJellies();
      }

      function initStars() {
        updateBlastBand();
        stars = [];
        var buffer = Math.max(18, Math.min(H * 0.06, SEA_TOP * 0.18));
        var startY = SEA_TOP - buffer;
        var endY = 6;
        if (startY < endY + 20) startY = endY + 20;
        var bandH = startY - endY;
        var count = Math.round((W * bandH) / 850);
        count = Math.max(350, Math.min(4000, count));
        for (var i = 0; i < count; i++) {
          var r = Math.random();
          var radius, baseAlpha;
          if (r < 0.75) {
            radius = 0.25 + Math.random() * 0.2;
            baseAlpha = 0.4;
          } else if (r < 0.92) {
            radius = 0.4 + Math.random() * 0.2;
            baseAlpha = 0.7;
          } else {
            radius = 0.55 + Math.random() * 0.25;
            baseAlpha = 1.0;
          }
          stars.push({
            x: Math.random() * W,
            y: endY + Math.random() * bandH,
            phase: Math.random() * Math.PI * 2,
            radius: radius,
            baseAlpha: baseAlpha
          });
        }
      }

      var JELLY_DEF = [
        { nx: 0.18, ny: 0.40, sizeMul: 0.90, hue: 210, phase: 0.0, drift: 0.9 },  // en sol: aşağı + sağa
        { nx: 0.36, ny: 0.68, sizeMul: 1.15, hue: 285, phase: 1.7, drift: 1.1 },  // sol-orta alt (aynı)
        { nx: 0.64, ny: 0.30, sizeMul: 1.00, hue: 195, phase: 3.3, drift: 0.8 },  // sağ-orta üst (aynı)
        { nx: 0.80, ny: 0.45, sizeMul: 1.10, hue: 300, phase: 5.1, drift: 1.0 }   // en sağ: yukarı + sola
      ];

      function initJellies() {
        jellies = [];
        var short = Math.min(W, H);
        var seaH = SEA_BOTTOM - SEA_TOP;
        var baseSize = Math.min(short * 0.016, seaH * 0.24);
        baseSize = Math.max(7, baseSize);
        for (var i = 0; i < JELLY_DEF.length; i++) {
          var d = JELLY_DEF[i];
          jellies.push({
            nx: d.nx,
            ny: d.ny,
            size: baseSize * d.sizeMul,
            hue: d.hue,
            phase: d.phase,
            drift: d.drift
          });
        }
      }

      var audioCtx = null;
      var isAudioReady = false;

      function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        if (wakeLock !== null) return;
        if (document.hidden) return;

        navigator.wakeLock.request('screen').then(function (lock) {
          wakeLock = lock;
          wakeLockRequested = true;
          lock.addEventListener('release', function () {
            wakeLock = null;
          });
        }).catch(function () {
          wakeLock = null;
        });
      }

      function releaseWakeLock() {
        if (wakeLock !== null) {
          wakeLock.release().catch(function () {});
          wakeLock = null;
        }
      }

      function unlockAudio() {
        wakeLockRequested = true;
        requestWakeLock();

        if (!soundEnabled) return;

        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().then(function () {
            audioUnlocked = true;
            isAudioReady = true;
          }).catch(function () {});
        } else {
          audioUnlocked = true;
          isAudioReady = true;
        }
      }

      function playExplosionSound(volume, distanceFactor) {
        if (!soundEnabled) return;
        if (!audioUnlocked || !audioCtx || !isAudioReady) return;

        var now = audioCtx.currentTime;

        var subOsc = audioCtx.createOscillator();
        var subGain = audioCtx.createGain();
        subOsc.type = 'triangle';
        subOsc.frequency.setValueAtTime(90, now);
        subOsc.frequency.exponentialRampToValueAtTime(32, now + 0.45);
        subGain.gain.setValueAtTime(0.0001, now);
        subGain.gain.exponentialRampToValueAtTime(
          volume * distanceFactor * 0.35,
          now + 0.01
        );
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
        subOsc.connect(subGain);
        subGain.connect(audioCtx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.6);

        var bufferSize = audioCtx.sampleRate * 0.9;
        var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        var data = buffer.getChannelData(0);
        var lastOut = 0;
        for (var i = 0; i < bufferSize; i++) {
          var white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.0 * Math.exp(-i / (audioCtx.sampleRate * 0.22));
        }

        var noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        var lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(3500, now);
        lp.frequency.exponentialRampToValueAtTime(600, now + 0.7);

        var hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 120;

        var noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(
          volume * distanceFactor * 0.7,
          now + 0.005
        );
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

        noise.connect(hp);
        hp.connect(lp);
        lp.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(now);

        var tailLen = Math.floor(audioCtx.sampleRate * 1.6);
        var tailBuf = audioCtx.createBuffer(1, tailLen, audioCtx.sampleRate);
        var tailData = tailBuf.getChannelData(0);
        var tailLast = 0;
        for (var t = 0; t < tailLen; t++) {
          var tw = Math.random() * 2 - 1;
          tailLast = (tailLast + 0.015 * tw) / 1.015;
          tailData[t] = tailLast * Math.exp(-t / (audioCtx.sampleRate * 0.6));
        }

        var tailSrc = audioCtx.createBufferSource();
        tailSrc.buffer = tailBuf;

        var tailLp = audioCtx.createBiquadFilter();
        tailLp.type = 'lowpass';
        tailLp.frequency.value = 800;

        var tailGain = audioCtx.createGain();
        tailGain.gain.setValueAtTime(0.0001, now + 0.2);
        tailGain.gain.exponentialRampToValueAtTime(
          volume * distanceFactor * 0.06,
          now + 0.25
        );
        tailGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

        tailSrc.connect(tailLp);
        tailLp.connect(tailGain);
        tailGain.connect(audioCtx.destination);
        tailSrc.start(now + 0.2);
      }

      function Particle(x, y, color, speed, angle, type) {
        this.x = x;
        this.y = y;
        this.prevX = x;
        this.prevY = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = type === 'ray' ? 0.008 : (0.012 + Math.random() * 0.01);
        this.color = color;
        this.size = Math.random() * 2 + 1;
        this.type = type;
        this.gravity = 0.05;
        this.friction = 0.97;
        this.flicker = Math.random() * Math.PI * 2;
      }

      Particle.prototype.update = function () {
        this.prevX = this.x;
        this.prevY = this.y;
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.life -= this.decay;
        this.size *= 0.99;
        if (this.life > 0) this.flicker += 0.3;
      };

      Particle.prototype.draw = function () {
        var alpha = this.life;
        if (this.life < 0.5) {
          alpha = this.life * (0.5 + 0.5 * Math.sin(this.flicker));
        }
        ctx.globalAlpha = alpha;
        if (this.type === 'ray') {
          ctx.strokeStyle = this.color;
          ctx.lineWidth = this.size;
          ctx.beginPath();
          ctx.moveTo(this.prevX, this.prevY);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        } else {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      var particles = [];
      var colors = [
        '#ff3333', '#33ff33', '#3333ff', '#ffff33',
        '#ff33ff', '#33ffff', '#ffaa00', '#ffffff',
        '#ff6600', '#ff0066', '#00ffcc'
      ];

      var BLAST_TOP = 0;
      var BLAST_BOTTOM = 0;

      function updateBlastBand() {
        BLAST_TOP = H * 0.06;
        BLAST_BOTTOM = SEA_TOP * 0.58;
      }

      function createExplosion(x, y, isClick) {
        if (y > BLAST_BOTTOM) y = BLAST_BOTTOM;
        if (y < BLAST_TOP) y = BLAST_TOP;

        var count = isClick ? 150 : (100 + Math.floor(Math.random() * 100));
        var baseSpeed = isClick ? 6 : (3.5 + Math.random() * 3.5);
        var baseColor = colors[Math.floor(Math.random() * colors.length)];
        var volume = isClick ? 1.0 : 0.8;
        var dist = Math.max(0.4, 1 - (y / H));

        for (var i = 0; i < count; i++) {
          var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          var speed = baseSpeed * (0.5 + Math.random() * 0.8);
          var pColor = baseColor;
          if (Math.random() < 0.25) {
            pColor = colors[Math.floor(Math.random() * colors.length)];
          }
          var type = Math.random() < 0.6 ? 'ray' : 'spark';
          particles.push(new Particle(x, y, pColor, speed, angle, type));
        }
        playExplosionSound(volume, dist);
      }

      function scheduleRandomExplosion() {
        if (!pageVisible) {
          randomExplosionTimer = null;
          return;
        }
        var delay = 400 + Math.random() * 1400;
        randomExplosionTimer = setTimeout(function () {
          randomExplosionTimer = null;
          if (!pageVisible) return;
          var burstCount = Math.random() < 0.4 ? 2 : 1;
          for (var b = 0; b < burstCount; b++) {
            var x = W * 0.1 + Math.random() * W * 0.8;
            var y = BLAST_TOP + Math.random() * (BLAST_BOTTOM - BLAST_TOP);
            (function (ex, ey) {
              setTimeout(function () {
                if (!pageVisible) return;
                createExplosion(ex, ey, false);
              }, b * 200);
            })(x, y);
          }
          scheduleRandomExplosion();
        }, delay);
      }

      function stopRandomExplosions() {
        if (randomExplosionTimer !== null) {
          clearTimeout(randomExplosionTimer);
          randomExplosionTimer = null;
        }
      }

      function handleInteraction(e) {
        var x = e.clientX;
        var y = e.clientY;

        var wasUnlocked = audioUnlocked;
        unlockAudio();

        if (!wasUnlocked && audioCtx && audioCtx.state !== "running") {
          var resumed = false;
          var doBurst = function () {
            if (resumed) return;
            resumed = true;
            createExplosion(x, y, true);
          };
          audioCtx.resume().then(doBurst).catch(doBurst);
          setTimeout(doBurst, 150);
        } else {
          createExplosion(x, y, true);
        }
      }

      canvas.addEventListener('pointerdown', function (e) {
        handleInteraction(e);
      });

      // iOS: pointerdown geçerli etkileşim sayılmaz; pointerup'ta context'i resume et
      canvas.addEventListener('pointerup', function () {
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(function () {});
        }
      }, { passive: true });

      function getMoon() {
        var shortSide = Math.min(W, H);
        var isPortrait = H > W;

        var cRadius = shortSide * 0.045;
        if (isPortrait) cRadius *= 1.1;
        cRadius = Math.max(14, Math.min(cRadius, 40));

        var cx = W * 0.5;
        var cy = Math.max(cRadius + 12, H * 0.13);
        return { x: cx, y: cy, r: cRadius };
      }

      function drawSky() {
        var n = 1;
        var moon = getMoon();

        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          var tw = 0.4 + 0.6 * Math.abs(Math.sin(animFrame * 0.04 + st.phase));
          ctx.globalAlpha = n * st.baseAlpha * tw;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.radius, 0, TWO_PI);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        var cx = moon.x, cy = moon.y, cRadius = moon.r;
        var glowR = cRadius * 2.8;
        var h = ctx.createRadialGradient(cx, cy, cRadius * 0.57, cx, cy, glowR);
        h.addColorStop(0, "rgba(200,210,255,0.35)");
        h.addColorStop(1, "rgba(200,210,255,0)");
        ctx.fillStyle = h;
        ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

        var m = ctx.createRadialGradient(
          cx - cRadius * 0.3, cy - cRadius * 0.3, cRadius * 0.15,
          cx, cy, cRadius * 1.07
        );
        m.addColorStop(0, "#fbf8e8");
        m.addColorStop(1, "#cfc9b0");
        ctx.fillStyle = m;
        ctx.beginPath();
        ctx.arc(cx, cy, cRadius, 0, TWO_PI);
        ctx.fill();

        ctx.fillStyle = "rgba(150,145,120,0.45)";
        var craters = [
          [-0.31, -0.23, 0.23],
          [0.31, 0.15, 0.18],
          [-0.15, 0.46, 0.12],
          [0.38, -0.46, 0.11]
        ];
        for (var c = 0; c < craters.length; c++) {
          ctx.beginPath();
          ctx.arc(
            cx + craters[c][0] * cRadius,
            cy + craters[c][1] * cRadius,
            craters[c][2] * cRadius,
            0, TWO_PI
          );
          ctx.fill();
        }
      }

      function seaWave(x, time) {
        return (
          Math.sin(x * 0.012 + time * 0.8) * 5 +
          Math.sin(x * 0.031 + time * 1.3) * 2.2 +
          Math.sin(x * 0.055 + time * 0.5) * 1.2
        );
      }

      function drawJelly(j) {
        var time = animFrame * 0.02;
        var seaH = SEA_BOTTOM - SEA_TOP;
        var usable = seaH * 0.70;
        var px = j.nx * W + Math.sin(time * 0.4 * j.drift + j.phase) * 6;
        var py = SEA_TOP + seaH * 0.15 + j.ny * usable
                 + Math.sin(time * 0.55 * j.drift + j.phase * 1.3) * (seaH * 0.04);
        var r = j.size;
        var pulse = 1 + Math.sin(animFrame * 0.06 + j.phase) * 0.15;
        var hue = j.hue;

        ctx.save();
        ctx.translate(px, py);

        var haloR = r * 4.0;
        var halo = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, haloR);
        halo.addColorStop(0, "hsla(" + hue + ", 90%, 70%, 0.55)");
        halo.addColorStop(0.4, "hsla(" + hue + ", 90%, 65%, 0.22)");
        halo.addColorStop(1, "hsla(" + hue + ", 90%, 65%, 0)");
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(0, 0, haloR, 0, TWO_PI);
        ctx.fill();

        var tentacleScale = 0.85 + (pulse - 1) * 1.2;
        ctx.lineCap = "round";
        for (var t = -2; t <= 2; t++) {
          for (var layer = 0; layer < 2; layer++) {
            ctx.strokeStyle = layer === 0
              ? "hsla(" + hue + ", 90%, 65%, 0.22)"
              : "hsla(" + hue + ", 90%, 78%, 0.75)";
            ctx.lineWidth = layer === 0 ? 3.0 : 1.2;
            ctx.beginPath();
            var tx = t * r * 0.32;
            ctx.moveTo(tx, r * 0.15);
            for (var s = 1; s <= 8; s++) {
              var yy = r * 0.15 + s * r * 0.32 * tentacleScale;
              var xx = tx + Math.sin(animFrame * 0.07 + s * 0.8 + t + j.phase) * r * 0.13;
              ctx.lineTo(xx, yy);
            }
            ctx.stroke();
          }
        }

        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.bezierCurveTo(-r, -r * 1.35 * pulse, r, -r * 1.35 * pulse, r, 0);
        ctx.quadraticCurveTo(0, r * 0.4, -r, 0);
        ctx.closePath();
        var bell = ctx.createLinearGradient(0, -r * 1.2, 0, r * 0.4);
        bell.addColorStop(0, "hsla(" + hue + ", 95%, 82%, 0.95)");
        bell.addColorStop(0.5, "hsla(" + hue + ", 88%, 65%, 0.80)");
        bell.addColorStop(1, "hsla(" + (hue + 15) + ", 85%, 45%, 0.60)");
        ctx.fillStyle = bell;
        ctx.fill();

        var innerGlow = ctx.createRadialGradient(
          -r * 0.3, -r * 0.5, r * 0.05,
          -r * 0.3, -r * 0.5, r * 0.9
        );
        innerGlow.addColorStop(0, "hsla(" + hue + ", 100%, 95%, 0.55)");
        innerGlow.addColorStop(1, "hsla(" + hue + ", 100%, 95%, 0)");
        ctx.fillStyle = innerGlow;
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.bezierCurveTo(-r, -r * 1.35 * pulse, r, -r * 1.35 * pulse, r, 0);
        ctx.quadraticCurveTo(0, r * 0.4, -r, 0);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "hsla(" + hue + ", 100%, 88%, 0.7)";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-r * 0.9, 0);
        ctx.quadraticCurveTo(0, r * 0.42, r * 0.9, 0);
        ctx.stroke();

        ctx.restore();
      }

      function drawSea() {
        var time = animFrame * 0.02;
        var seaH = SEA_BOTTOM - SEA_TOP;

        var seaGrad = ctx.createLinearGradient(0, SEA_TOP - 8, 0, SEA_BOTTOM);
        seaGrad.addColorStop(0, SEA_TOP_COLOR);
        seaGrad.addColorStop(0.35, "#0f1830");
        seaGrad.addColorStop(1, SEA_BOTTOM_COLOR);

        ctx.fillStyle = seaGrad;
        ctx.beginPath();
        ctx.moveTo(0, SEA_BOTTOM);
        for (var x = 0; x <= W + 8; x += 6) {
          var wy = SEA_TOP + seaWave(x, time);
          ctx.lineTo(x, wy);
        }
        ctx.lineTo(W + 8, SEA_BOTTOM);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, SEA_TOP - 10, W, SEA_BOTTOM - SEA_TOP + 10);
        ctx.clip();

        var prevComp = ctx.globalCompositeOperation;
        ctx.globalCompositeOperation = "lighter";
        for (var ji = 0; ji < jellies.length; ji++) drawJelly(jellies[ji]);
        ctx.globalCompositeOperation = prevComp;

        ctx.restore();

        var waves = [
          { dy: 4,  amp: 2.5, freq: 0.03,  speed: 0.04,  alpha: 0.55 },
          { dy: 10, amp: 3.5, freq: 0.022, speed: -0.03, alpha: 0.38 },
          { dy: 18, amp: 4.5, freq: 0.016, speed: 0.022, alpha: 0.25 }
        ];
        ctx.lineWidth = 2;
        for (var wi = 0; wi < waves.length; wi++) {
          var w = waves[wi];
          ctx.strokeStyle = "rgba(255,255,255," + w.alpha + ")";
          ctx.beginPath();
          for (var wx = 0; wx <= W + 8; wx += 8) {
            var wyy = SEA_TOP + w.dy +
                      Math.sin(wx * w.freq + animFrame * w.speed + wi) * w.amp;
            if (wx === 0) ctx.moveTo(wx, wyy);
            else ctx.lineTo(wx, wyy);
          }
          ctx.stroke();
        }
      }

      function drawScene() {
        var sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, SKY_TOP);
        sky.addColorStop(1, SKY_BOTTOM);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        drawSky();
        drawSea();
      }

      function loop() {
        if (!pageVisible) {
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(loop);
        animFrame++;

        drawScene();

        ctx.globalCompositeOperation = 'lighter';
        for (var j = particles.length - 1; j >= 0; j--) {
          var p = particles[j];
          p.update();
          if (p.life <= 0) {
            particles.splice(j, 1);
          } else {
            p.draw();
          }
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      function startLoop() {
        if (rafId === null) {
          rafId = requestAnimationFrame(loop);
        }
      }

      function init() {
        resize();
        updateBlastBand();
        startLoop();
      }

      document.addEventListener("visibilitychange", function () {
        pageVisible = !document.hidden;

        if (pageVisible) {
          startLoop();
          if (soundEnabled && audioCtx && audioCtx.state === "suspended" && audioUnlocked) {
            audioCtx.resume().catch(function () {});
          }
          if (audioUnlocked && randomExplosionTimer === null) {
            scheduleRandomExplosion();
          }
          if (wakeLockRequested) requestWakeLock();
        } else {
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          stopRandomExplosions();
          if (audioCtx && audioCtx.state === "running") {
            audioCtx.suspend().catch(function () {});
          }
          releaseWakeLock();
        }
      });

      canvas.addEventListener('pointerdown', function firstTap() {
        scheduleRandomExplosion();
        canvas.removeEventListener('pointerdown', firstTap);
      }, { once: true });

      window.addEventListener("pagehide", function () {
        stopRandomExplosions();
        releaseWakeLock();
      });

      var lastW = 0, lastH = 0;
      window.addEventListener("resize", function () {
        var nw = window.innerWidth;
        var nh = window.innerHeight;
        if (Math.abs(nw - lastW) < 4 && Math.abs(nh - lastH) < 80) return;
        lastW = nw;
        lastH = nh;
        resize();
        updateBlastBand();
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(function () {
          resize();
          updateBlastBand();
        }, 250);
        setTimeout(function () {
          resize();
          updateBlastBand();
        }, 600);
      });

      // ---- Ses kontrolü düğmesi ----
      var soundBtn = document.getElementById("soundBtn");
      var soundOnIcon = document.getElementById("soundOnIcon");
      var soundOffIcon = document.getElementById("soundOffIcon");

      function updateSoundButton() {
        if (soundEnabled) {
          soundOnIcon.style.display = "";
          soundOffIcon.style.display = "none";
          soundBtn.setAttribute("aria-pressed", "true");
        } else {
          soundOnIcon.style.display = "none";
          soundOffIcon.style.display = "";
          soundBtn.setAttribute("aria-pressed", "false");
        }
      }

      soundBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        updateSoundButton();

        if (!soundEnabled) {
          if (audioCtx && audioCtx.state === "running") {
            audioCtx.suspend().catch(function () {});
          }
        } else {
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume().catch(function () {});
          }
        }
      });

      soundBtn.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
      });

      updateSoundButton();

      init();
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        var reloading = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloading || !window.__swHadController) return;
          reloading = true;
          location.reload();
        });
        window.__swHadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          reg.update();
        }).catch(function () {});
      });
    }
  </script>
